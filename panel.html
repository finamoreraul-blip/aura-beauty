<!DOCTYPE html>

<body class="bg-[#FFF9FB]">

<div class="grid lg:grid-cols-[420px_1fr] gap-6 mt-5">

<input type="hidden" id="editId">
<input id="nombre" placeholder="Nombre *" class="w-full border-2 border-black rounded-full px-4 py-3 text-sm font-bold mt-3">

<div class="grid grid-cols-2 gap-2 mt-2"><select id="categoria" class="border-2 border-black rounded-full px-4 py-3 text-sm font-bold"><option>Labios</option><option>Rostro</option><option>Ojos</option><option>Skincare</option><option>Accesorios</option><option>Combos</option></select><select id="stock" class="border-2 border-black rounded-full px-4 py-3 text-sm"><option value="10">Con stock</option><option value="3">Últimas</option><option value="0">Sin stock</option></select></div>

<div class="border-2 border-black rounded-[18px] mt-4 overflow-hidden">
<div id="dropZone" class="bg-zinc-50 p-4 text-center cursor-pointer">📸 SUBIR FOTO<input type="file" id="fileInput" accept="image/*" hidden></div>
<canvas id="editorCanvas" class="w-full hidden"></canvas>
<img id="preview" class="hidden w-full h-64 object-contain bg-white">

<div class="border-t pt-3">
<label class="text-[10px] font-bold">FONDO - ELEGÍ COLOR</label>
<div class="flex gap-2 items-center mt-2 flex-wrap">
<input type="color" id="bgColor" value="#ffffff" class="w-10 h-10 rounded-full border-2 border-black cursor-pointer">
<button onclick="setBg('#ffffff')" class="w-8 h-8 rounded-full border-2 border-black bg-white" title="Blanco"></button>
<button onclick="setBg('#FFD6E7')" class="w-8 h-8 rounded-full border-2 border-black" style="background:#FFD6E7" title="Rosa Aura"></button>
<button onclick="setBg('#000000')" class="w-8 h-8 rounded-full border-2 border-white bg-black" title="Negro"></button>
<button onclick="setBg('#F5F0EB')" class="w-8 h-8 rounded-full border-2 border-black" style="background:#F5F0EB" title="Beige"></button>

</div>
<script>
let productos=JSON.parse(localStorage.getItem('aura_editor')||'[]');
if(productos.length===0){productos=[{id:1,nombre:"Gloss Pétala",precio:5800,precioOferta:4900,categoria:"Labios",stock:10,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600",desc:"",caracteristicas:[],ficha:{},visible:true,destacado:true,tags:["NUEVO"]}];}
let imgBase64=""; let originalImg=new Image(); let currentFilter={b:100,c:100,s:100,bg:'#ffffff',watermark:''}; let draggedId=null;
['ghOwner','ghRepo','ghToken','ghBranch'].forEach(k=>{const v=localStorage.getItem(k); if(v) document.getElementById(k).value=v; document.getElementById(k).addEventListener('input',e=>localStorage.setItem(k,e.target.value));});
function save(){localStorage.setItem('aura_editor',JSON.stringify(productos)); render();}
function render(){document.getElementById('lista').innerHTML=productos.map((p,i)=>`<div class="card bg-white border-2 border-black rounded-[18px] overflow-hidden relative" draggable="true" data-id="${p.id}"><div class="absolute top-1 left-1 bg-black text-white text-[10px] w-6 h-6 flex items-center justify-center rounded-full font-bold">${i+1}</div><img src="${p.img}" class="w-full h-32 object-cover"><div class="p-2"><p class="brico font-bold text-[11px] truncate">${p.nombre}</p></div><div class="p-2 pt-0 flex gap-1"><button onclick="editar(${p.id})" class="text-[9px] border-2 border-black rounded-full px-2 py-1">EDIT</button><button onclick="borrar(${p.id})" class="text-[9px] bg-black text-white rounded-full px-2 py-1">X</button></div></div>`).join('');}
function guardar(){const id=document.getElementById('editId').value; const data={id:id?parseInt(id):Date.now(),nombre:document.getElementById('nombre').value.trim(),precio:parseInt(document.getElementById('precio').value)||0,precioOferta:parseInt(document.getElementById('precioOferta').value)||0,categoria:document.getElementById('categoria').value,stock:parseInt(document.getElementById('stock').value),img:imgBase64||document.getElementById('imgUrl').value||"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600",desc:document.getElementById('desc').value,caracteristicas:document.getElementById('caracts').value.split(',').map(s=>s.trim()).filter(Boolean),ficha:{Marca:"AURA"},visible:document.getElementById('visible').checked,destacado:document.getElementById('destacado').checked,tags:[...(document.getElementById('tagNuevo').checked?["NUEVO"]:[]),...(document.getElementById('tagTop').checked?["TOP"]:[])]};
if(!data.nombre||!data.precio) return alert("Falta nombre/precio"); if(id){productos=productos.map(p=>p.id==id?{...p,...data}:p);}else{productos.unshift(data);} save(); document.getElementById('editId').value="";}
function editar(id){const p=productos.find(x=>x.id===id); document.getElementById('editId').value=p.id; document.getElementById('nombre').value=p.nombre; document.getElementById('precio').value=p.precio; document.getElementById('precioOferta').value=p.precioOferta||"";}
function borrar(id){if(confirm("Borrar?")){productos=productos.filter(p=>p.id!==id); save();}}
// EDITOR
const canvas=document.getElementById('editorCanvas'); const ctx=canvas.getContext('2d'); const preview=document.getElementById('preview');
function loadImageToEditor(src){originalImg=new Image(); originalImg.crossOrigin="anonymous"; originalImg.onload=()=>{canvas.width=originalImg.width; canvas.height=originalImg.height; document.getElementById('editorControls').classList.remove('hidden'); canvas.classList.remove('hidden'); preview.classList.add('hidden'); currentFilter={b:100,c:100,s:100,bg:document.getElementById('bgColor').value,watermark:''}; document.getElementById('brillo').value=100; document.getElementById('contraste').value=100; document.getElementById('sat').value=100; draw();}; originalImg.src=src;}
function draw(){if(!originalImg.src) return; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle=currentFilter.bg; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.filter=`brightness(${currentFilter.b}%) contrast(${currentFilter.c}%) saturate(${currentFilter.s}%)`; ctx.drawImage(originalImg,0,0); ctx.filter='none'; if(currentFilter.watermark){ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.font=`bold ${Math.max(24,canvas.width*0.06)}px 'Bricolage Grotesque'`; ctx.fillText(currentFilter.watermark,20,canvas.height-30); ctx.font=`italic ${Math.max(14,canvas.width*0.03)}px 'Instrument Serif'`; ctx.fillStyle='rgba(0,0,0,0.5)';}}
function setBg(c){document.getElementById('bgColor').value=c; currentFilter.bg=c; draw();}
function removeBg(){currentFilter.bg='#ffffff'; document.getElementById('bgColor').value='#ffffff'; draw();}
function addWatermark(txt){currentFilter.watermark=txt; draw();}
function resetImg(){currentFilter={b:100,c:100,s:100,bg:'#ffffff',watermark:''}; document.getElementById('bgColor').value='#ffffff'; document.getElementById('brillo').value=100; document.getElementById('contraste').value=100; document.getElementById('sat').value=100; draw();}
document.getElementById('brillo').oninput=e=>{currentFilter.b=e.target.value; document.getElementById('vBrillo').innerText=e.target.value; draw();};
document.getElementById('contraste').oninput=e=>{currentFilter.c=e.target.value; document.getElementById('vContraste').innerText=e.target.value; draw();};
document.getElementById('sat').oninput=e=>{currentFilter.s=e.target.value; document.getElementById('vSat').innerText=e.target.value; draw();};
document.getElementById('bgColor').oninput=e=>{currentFilter.bg=e.target.value; draw();};
function aplicarCambios(){imgBase64=canvas.toDataURL('image/jpeg',0.9); preview.src=imgBase64; preview.classList.remove('hidden'); canvas.classList.add('hidden'); document.getElementById('editorControls').classList.add('hidden'); document.getElementById('imgUrl').value="";}
const dz=document.getElementById('dropZone'); dz.onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{loadImageToEditor(r.result);}; r.readAsDataURL(f);};

function buildIndexHTML(){return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>AURA</title><script src="https://cdn.tailwindcss.com"><\/script><\/head><body><script>const productos=${JSON.stringify(productos)}<\/script><h1>AURA ${productos.length} productos<\/h1><\/body><\/html>`;}
