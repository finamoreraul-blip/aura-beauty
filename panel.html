
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA IA EDITOR V6.1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#050505;color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Playfair Display',serif;font-size:28px;background:linear-gradient(90deg,#ff8fab,#ffc2d1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-align:center}
.sub{font-size:9px;letter-spacing:6px;color:#444;margin:6px 0 24px}
.card{width:100%;max-width:600px;background:#101010;border:1px solid #1e1e1e;border-radius:24px;padding:24px;margin-bottom:16px}
.label{font-size:10px;letter-spacing:2px;color:#ff8fab;font-weight:800;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.label span{color:#666;font-size:9px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea,select{width:100%;background:#080808;border:1px solid #222;color:#fff;padding:13px;border-radius:11px;outline:none;font-size:14px;transition:.2s}
input.enmarcado,textarea.enmarcado,select.enmarcado{border:2px solid #ff8fab;box-shadow:0 0 15px rgba(255,143,171,.3)}
#dropZone{border:2px dashed #2a2a2a;border-radius:18px;min-height:300px;background:#080808;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;cursor:pointer}
#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#dropContent{z-index:2;text-align:center;background:rgba(0,0,0,.7);padding:10px 16px;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid #2a2a2a;background:#0a0a0a;padding:8px 13px;border-radius:30px;font-size:11px;cursor:pointer}
.chip.active{border-color:#ff8fab;background:#ff8fab22;color:#ff8fab}
.chip input{display:none}
.btn-main{width:100%;padding:17px;border-radius:13px;border:none;font-weight:800;background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:#fff;margin-top:22px;cursor:pointer}
.btn-sec{width:100%;padding:12px;border-radius:11px;border:1px solid #222;background:#0a0a0a;color:#666;margin-top:10px;cursor:pointer;font-size:11px}
.btn-google{width:100%;padding:12px;border-radius:11px;border:1px solid #4285f4;background:rgba(66,133,244,.1);color:#4285f4;margin-top:10px;cursor:pointer;font-size:11px;font-weight:700;display:none}
.msg{margin-top:12px;padding:11px;border-radius:10px;text-align:center;font-size:12px;display:none}
.ok{display:block;background:#10b98115;color:#10b981;border:1px solid #10b98122}
.err{display:block;background:#ef444415;color:#ef4444;border:1px solid #ef444422}
#editorModal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#editorCanvas{max-width:90%;max-height:60vh;border-radius:12px}
.editorControls{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.editorControls button,.editorControls input{padding:10px 14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:12px}
</style>
</head>
<body>
<h1>AURA IA EDITOR</h1>
<p class="sub">V6.1 - CON EDITOR + GOOGLE</p>

<div class="card">
<span class="label">📸 FOTO <span onclick="document.getElementById('nombre').classList.toggle('enmarcado')">📌 Enmarcar</span></span>
<div id="dropZone" onclick="document.getElementById('fileInput').click()">
<img id="preview">
<div id="dropContent">👆 TOCA PARA GALERÍA</div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<button class="btn-sec" id="btnEditor" style="display:none" onclick="abrirEditor()">🎨 EDITOR DE FOTO - RECORTAR / BRILLO</button>
<button class="btn-google" id="btnGoogle" onclick="buscarGoogle()">🔍 BUSCAR EN GOOGLE CARACTERÍSTICAS DE ESTA FOTO</button>

<span class="label">NOMBRE <span onclick="document.getElementById('nombre').classList.toggle('enmarcado')">📌 Enmarcar</span></span>
<input id="nombre" placeholder="Ej: Labial Velvet Rosa">

<div class="row">
<div><span class="label">PRECIO <span onclick="document.getElementById('precio').classList.toggle('enmarcado')">📌</span></span><input id="precio" type="number" placeholder="5500"></div>
<div><span class="label">DESCUENTO</span><select id="descuento"><option value="0">Ninguno</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option></select></div>
</div>

<div class="row">
<div><span class="label">STOCK <span onclick="document.getElementById('stock').classList.toggle('enmarcado')">📌</span></span><input id="stock" type="number" placeholder="12"></div>
<div><span class="label">CONTENIDO</span><input id="contenido" placeholder="15ml"></div>
</div>

<div class="row">
<div><span class="label">TONO</span><input id="tono" placeholder="Rosa #02"></div>
<div><span class="label">ACABADO</span><select id="acabado"><option>Mate</option><option>Brilloso</option><option>Satinado</option><option>Cremoso</option><option>Metalizado</option></select></div>
</div>

<span class="label">CATEGORÍA</span>
<select id="categoria"><option>Labiales</option><option>Skincare</option><option>Perfumes</option><option>Maquillaje</option><option>Ojos</option><option>Uñas</option></select>

<span class="label">TIPO PIEL</span>
<select id="piel"><option>Todo tipo</option><option>Grasa</option><option>Seca</option><option>Mixta</option><option>Sensible</option></select>

<span class="label">CARACTERÍSTICAS - IA <span onclick="document.querySelectorAll('#car1,#car2,#ingredientes').forEach(e=>e.classList.toggle('enmarcado'))">📌 Enmarcar todas</span></span>
<input id="car1" placeholder="Larga duración 12hs">
<input id="car2" placeholder="Hipoalergénico" style="margin-top:6px">
<input id="ingredientes" placeholder="Ingredientes clave" style="margin-top:6px">
<textarea id="modo" rows="2" placeholder="Modo de uso" style="margin-top:6px"></textarea>
<textarea id="desc" rows="2" placeholder="Descripción" style="margin-top:6px"></textarea>

<span class="label">🏷️ COLECCIONES</span>
<div class="chips">
<label class="chip"><input type="checkbox" value="novedad">✨ Novedad</label>
<label class="chip"><input type="checkbox" value="se-va-pronto">🔥 Se va pronto</label>
<label class="chip"><input type="checkbox" value="liquidacion">💥 Liquidación</label>
<label class="chip"><input type="checkbox" value="mas-vendido">⭐ Más vendido</label>
<label class="chip"><input type="checkbox" value="exclusivo">💎 Exclusivo</label>
<label class="chip"><input type="checkbox" value="edicion-limitada">🔒 Edición Limitada</label>
<label class="chip"><input type="checkbox" value="cruelty-free">🐰 Cruelty Free</label>
<label class="chip"><input type="checkbox" value="envio-gratis">🚚 Envío Gratis</label>
</div>

<button class="btn-main" id="btnPubli" onclick="publicar()">💾 GUARDAR Y SUBIR EN VIVO</button>
<div id="msg" class="msg"></div>
<button class="btn-sec" onclick="window.open('https://finamoreraul-blip.github.io/aura-beauty/','_blank')">🔗 VER MI TIENDA</button>

<div style="text-align:center;margin-top:18px">
  <span onclick="renovarToken()" style="font-size:9px;letter-spacing:2px;color:#555;cursor:pointer;text-decoration:underline">🔑 RENOVAR TOKEN</span>
</div>

</div>

<div id="editorModal">
<img id="editorImg" style="max-width:90%;max-height:60vh;border-radius:12px;display:none">
<canvas id="editorCanvas"></canvas>
<div class="editorControls">
<label>Brillo <input type="range" id="brillo" min="0" max="200" value="100"></label>
<label>Contraste <input type="range" id="contraste" min="0" max="200" value="100"></label>
<button onclick="rotar()">🔄 Rotar</button>
<button onclick="aplicarFiltro('bw')">⚫ B/N</button>
<button onclick="guardarEdicion()" style="background:#ff4d6d;color:white;border:none;font-weight:800">✅ APLICAR</button>
<button onclick="cerrarEditor()">❌ Cerrar</button>
</div>
</div>

<script>
const REPO="finamoreraul-blip/aura-beauty";
let token=localStorage.getItem("gh_token");
if(!token){token=prompt("Token ghp_:"); if(token){localStorage.setItem("gh_token",token.trim()); token=token.trim();}}
let b64=null,nameImg=null, originalSrc=null, rot=0;
const dz=document.getElementById("dropZone"), fi=document.getElementById("fileInput"), prev=document.getElementById("preview"), dc=document.getElementById("dropContent"), btnEditor=document.getElementById("btnEditor"), btnGoogle=document.getElementById("btnGoogle");
fi.addEventListener("change",()=>handle(fi.files[0]));
dz.addEventListener("dragover",e=>{e.preventDefault()});
dz.addEventListener("drop",e=>{e.preventDefault(); handle(e.dataTransfer.files[0])});
function handle(f){
 if(!f) return;
 nameImg=Date.now()+"_"+f.name.replace(/\s/g,"_");
 let r=new FileReader();
 r.onload=e=>{b64=e.target.result.split(",")[1]; originalSrc=e.target.result; prev.src=e.target.result; prev.style.display="block"; dc.innerText="✅ "+f.name; btnEditor.style.display="block"; btnGoogle.style.display="block";};
 r.readAsDataURL(f);
}
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{c.classList.toggle("active"); c.querySelector("input").checked=c.classList.contains("active")}));
function decode(b){try{const c=b.replace(/\n/g,""); const bin=atob(c); const u=Uint8Array.from(bin,x=>x.charCodeAt(0)); return new TextDecoder().decode(u);}catch{return "[]";}}
const modal=document.getElementById("editorModal"), canvas=document.getElementById("editorCanvas"), ctx=canvas.getContext("2d"), imgEditor=new Image();
function abrirEditor(){
 modal.style.display="flex";
 imgEditor.src=originalSrc;
 imgEditor.onload=()=>{canvas.width=imgEditor.width; canvas.height=imgEditor.height; draw();}
}
function draw(){
 const bri=document.getElementById("brillo").value, cont=document.getElementById("contraste").value;
 ctx.filter=`brightness(${bri}%) contrast(${cont}%)`;
 ctx.save(); ctx.translate(canvas.width/2,canvas.height/2); ctx.rotate(rot*Math.PI/180); ctx.drawImage(imgEditor,-imgEditor.width/2,-imgEditor.height/2); ctx.restore();
}
document.getElementById("brillo").addEventListener("input",draw);
document.getElementById("contraste").addEventListener("input",draw);
function rotar(){rot=(rot+90)%360; draw();}
function aplicarFiltro(t){if(t=='bw') ctx.filter='grayscale(100%)'; draw();}
function guardarEdicion(){
 const dataUrl=canvas.toDataURL("image/jpeg",0.9);
 b64=dataUrl.split(",")[1];
 prev.src=dataUrl;
 originalSrc=dataUrl;
 cerrarEditor();
}
function cerrarEditor(){modal.style.display="none";}
function buscarGoogle(){
 const nombre=document.getElementById("nombre").value || "labial maquillaje";
 const tono=document.getElementById("tono").value || "";
 const query=`${nombre} ${tono} características ingredientes modo de uso`;
 window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`,'_blank');
 window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`,'_blank');
}
function renovarToken(){
  if(confirm("¿Borrar token viejo y poner uno nuevo?")){
    localStorage.removeItem('gh_token');
    location.reload();
  }
}
async function publicar(){
 const msg=document.getElementById("msg"), btn=document.getElementById("btnPubli");
 try{
  if(!b64) throw new Error("Cargá foto");
  const nombre=document.getElementById("nombre").value.trim();
  const precio=document.getElementById("precio").value.trim();
  if(!nombre||!precio) throw new Error("Falta nombre/precio");
  msg.innerText="✅ ¡PUM! En vivo";
  btn.disabled=false;
 }catch(e){msg.className="msg err"; msg.innerText="❌ "+e.message; document.getElementById("btnPubli").disabled=false;}
}
</script>
</body>
</html>
