<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QR Aura Beauty</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial}</style>
</head><body>
<h2>www.aurabeautyar.com</h2>
<canvas id="qr"></canvas>
<script>

</script>
<p>Hacé click derecho sobre el QR → Guardar imagen</p>
</body></html>
