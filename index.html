<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA BEAUTY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(1200px at 20% -10%, #1a1020 0%, #050505 55%);color:#fff;min-height:100vh}
header{padding:22px;text-align:center;border-bottom:1px solid #161616;position:sticky;top:0;background:rgba(5,5,5,.88);backdrop-filter:blur(12px);z-index:20}
h1{font-family:'Playfair Display',serif;font-size:34px;letter-spacing:2px;background:linear-gradient(90deg,#ff8fab,#ffc2d1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:9px;letter-spacing:7px;color:#555;margin-top:6px}
.container{max-width:1150px;margin:0 auto;padding:18px 18px 110px}
.search{width:100%;background:#0c0c0c;border:1px solid #1e1e1e;padding:15px 18px;border-radius:16px;color:#fff;outline:none;font-size:14px}
.search:focus{border-color:#ff8fab}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 14px}
.chip{border:1px solid #232323;background:#0a0a0a;padding:9px 14px;border-radius:30px;font-size:11px;cursor:pointer;transition:.2s}
.chip.active{border-color:#10b981!important;background:rgba(16,185,129,.18)!important;color:#10b981!important;font-weight:800;box-shadow:0 0 14px rgba(16,185,129,.4);transform:scale(1.05)}
.cats{display:flex;gap:8px;overflow:auto;padding:6px 0 10px}
.cat{white-space:nowrap;border:1px solid #1e1e1e;background:#0a0a0a;padding:9px 15px;border-radius:22px;font-size:11px;cursor:pointer}
.cat.active{background:#fff;color:#000;font-weight:800;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-top:10px}
.card{background:linear-gradient(180deg,#121212,#0c0c0c);border:1px solid #1e1e1e;border-radius:22px;overflow:hidden;position:relative}
.imgWrap{aspect-ratio:1;background:#080808;position:relative;overflow:hidden}
.imgWrap img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#10b981;color:#fff;font-size:10px;font-weight:800;padding:5px 10px;border-radius:20px}
.badge.off{background:linear-gradient(90deg,#ff4d6d,#ff8fab)}
.info{padding:12px 12px}
.name{font-size:13px;font-weight:700;line-height:1.2;min-height:34px}
.cont{font-size:10px;color:#777;margin:4px 0}
.priceRow{display:flex;align-items:center;gap:7px;margin-top:8px}
.price{font-size:17px;font-weight:800}
.priceOld{font-size:12px;color:#555;text-decoration:line-through}
.offText{font-size:11px;color:#10b981;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:8px;padding:4px 7px;border-radius:10px;background:#161616;border:1px solid #222;color:#888}
.btnAdd{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:none;background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:#fff;font-weight:800;font-size:11px;cursor:pointer;letter-spacing:.5px}
.btnAdd:active{transform:scale(.97)}
.cartFloat{position:fixed;bottom:20px;right:18px;left:18px;max-width:420px;margin:0 auto;background:#0f0f0f;border:1px solid #222;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:50}
.cartFloat span{font-size:12px;color:#aaa}
.cartFloat b{font-size:16px}
.btnCart{padding:11px 18px;border-radius:12px;border:none;background:#fff;color:#000;font-weight:800;font-size:12px;cursor:pointer}
#cartModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:none;align-items:end;justify-content:center}
.cartBox{background:#0f0f0f;border:1px solid #222;border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:20px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #151515;align-items:center}
.item img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#080808}
.itemName{font-size:13px;font-weight:600}
.itemPrice{font-size:12px;color:#10b981;font-weight:800}
.btnWsp{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(90deg,#10b981,#34d399);color:#fff;font-weight:800;margin-top:16px;cursor:pointer;font-size:14px}
.btnClose{width:100%;padding:12px;border-radius:12px;border:1px solid #222;background:#0a0a0a;color:#666;margin-top:8px;cursor:pointer}
.empty{color:#444;text-align:center;padding:40px}
</style>
</head>
<body>
<header>
<h1>AURA BEAUTY</h1>
<div class="sub">BY RAÚL FINAMORE - TRES ARROYOS</div>
</header>

<div class="container">
<input id="buscador" class="search" placeholder="🔍 Buscar labial, tono, colección...">

<div class="chips" id="chipsColecciones">
<div class="chip" data-tag="novedad">✨ Novedad</div>
<div class="chip" data-tag="se-va-pronto">🔥 Se va pronto</div>
<div class="chip" data-tag="liquidacion">💥 Liquidación</div>
<div class="chip" data-tag="mas-vendido">⭐ Más vendido</div>
<div class="chip" data-tag="exclusivo">💎 Exclusivo</div>
<div class="chip" data-tag="edicion-limitada">🔒 Edición Limitada</div>
<div class="chip" data-tag="cruelty-free">🐰 Cruelty Free</div>
<div class="chip" data-tag="envio-gratis">🚚 Envío Gratis</div>
</div>

<div class="cats" id="cats">
<div class="cat active" data-cat="todos">Todos</div>
<div class="cat" data-cat="Labiales">Labiales</div>
<div class="cat" data-cat="Skincare">Skincare</div>
<div class="cat" data-cat="Perfumes">Perfumes</div>
<div class="cat" data-cat="Maquillaje">Maquillaje</div>
<div class="cat" data-cat="Ojos">Ojos</div>
<div class="cat" data-cat="Uñas">Uñas</div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">No encontramos nada con ese filtro</div>
</div>

<div class="cartFloat" id="cartFloat" style="display:none">
<div>
<span id="cartCount">0 productos</span><br>
<b id="cartTotal">$0</b>
</div>
<button class="btnCart" onclick="abrirCarrito()">VER CARRITO 🛒</button>
</div>

<div id="cartModal">
<div class="cartBox">
<h3 style="font-family:'Playfair Display',serif;font-size:20px;margin-bottom:10px">Tu carrito</h3>
<div id="cartItems"></div>
<button class="btnWsp" onclick="enviarWsp()">FINALIZAR POR WHATSAPP</button>
<button class="btnClose" onclick="cerrarCarrito()">Seguir comprando</button>
</div>
</div>

<script>
const WSP = "5492983389710";
let productos=[];
let filtroCat="todos";
let filtroTags=[];
let texto="";
let carrito=JSON.parse(localStorage.getItem("aura_cart")||"[]");

async function cargar(){
  try{
    const r=await fetch("https://raw.githubusercontent.com/finamoreraul-blip/aura-beauty/main/productos.json?t="+Date.now());
    productos=await r.json();
    render();
    updateFloat();
  }catch(e){
    document.getElementById("grid").innerHTML="<div class='empty'>Error cargando. Verificá productos.json</div>";
  }
}

function render(){
  const grid=document.getElementById("grid");
  let lista=[...productos].reverse();
  if(filtroCat!=="todos") lista=lista.filter(p=>p.categoria===filtroCat);
  if(filtroTags.length>0) lista=lista.filter(p=>p.tags && filtroTags.some(t=>p.tags.includes(t)));
  if(texto){
    const q=texto.toLowerCase();
    lista=lista.filter(p=> (p.nombre+" "+(p.tono||"")+" "+(p.categoria||"")+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));
  }
  if(lista.length===0){ grid.innerHTML=""; document.getElementById("empty").style.display="block"; return; }
  document.getElementById("empty").style.display="none";
  grid.innerHTML=lista.map(p=>{
    const tieneDesc=p.precioTachado && p.precioTachado>p.precio;
    const porc=tieneDesc? Math.round(100-(p.precio*100/p.precioTachado)) : (p.descuento||0);
    return `<div class="card">
      <div class="imgWrap">
        <img src="${p.imagen}" loading="lazy">
        ${porc>0? `<div class="badge off">-${porc}% OFF</div>` : (p.tags?.includes('novedad')? `<div class="badge">NUEVO</div>` : '')}
      </div>
      <div class="info">
        <div class="name">${p.nombre}</div>
        <div class="cont">${p.contenido||""} ${p.tono? "• "+p.tono : ""}</div>
        <div class="priceRow">
          <span class="price">$${p.precio}</span>
          ${tieneDesc? `<span class="priceOld">$${p.precioTachado}</span><span class="offText">-${porc}%</span>` : ""}
        </div>
        ${p.tags?.length? `<div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>` : ""}
        <button class="btnAdd" onclick="addCart(${p.id})">AGREGAR AL CARRITO</button>
      </div>
    </div>`;
  }).join("");
}

function addCart(id){
  const p=productos.find(x=>x.id===id);
  if(!p) return;
  carrito.push(p);
  localStorage.setItem("aura_cart",JSON.stringify(carrito));
  updateFloat();
  // animación
  const f=document.getElementById("cartFloat");
  f.style.transform="scale(1.05)"; setTimeout(()=>f.style.transform="scale(1)",150);
}

function updateFloat(){
  const f=document.getElementById("cartFloat");
  if(carrito.length===0){ f.style.display="none"; return; }
  f.style.display="flex";
  const total=carrito.reduce((s,p)=>s+p.precio,0);
  document.getElementById("cartCount").innerText=carrito.length+" productos";
  document.getElementById("cartTotal").innerText="$"+total;
  renderCartItems();
}

function renderCartItems(){
  const box=document.getElementById("cartItems");
  if(carrito.length===0){ box.innerHTML="<div class='empty'>Carrito vacío</div>"; return; }
  box.innerHTML=carrito.map((p,i)=>`<div class="item">
    <img src="${p.imagen}">
    <div style="flex:1">
      <div class="itemName">${p.nombre}</div>
      <div class="itemPrice">$${p.precio} ${p.precioTachado? `<span style="color:#555;text-decoration:line-through;font-weight:400">$${p.precioTachado}</span>` : ""}</div>
    </div>
    <span onclick="removeItem(${i})" style="cursor:pointer;color:#444">✕</span>
  </div>`).join("");
}

function removeItem(i){ carrito.splice(i,1); localStorage.setItem("aura_cart",JSON.stringify(carrito)); updateFloat(); }
function abrirCarrito(){ document.getElementById("cartModal").style.display="flex"; renderCartItems(); }
function cerrarCarrito(){ document.getElementById("cartModal").style.display="none"; }

function enviarWsp(){
  if(carrito.length===0) return;
  const total=carrito.reduce((s,p)=>s+p.precio,0);
  let msg="Hola Aura Beauty! Quiero comprar:%0A";
  carrito.forEach(p=>{ msg+=`• ${p.nombre} - $${p.precio}${p.tono? " ("+p.tono+")":""}%0A`; });
  msg+=`%0ATotal: $${total}%0A%0AEnvío a Tres Arroyos?`;
  window.open(`https://wa.me/${WSP}?text=${msg}`,"_blank");
}

document.getElementById("buscador").addEventListener("input",e=>{ texto=e.target.value; render(); });
document.querySelectorAll(".chip").forEach(ch=>{
  ch.addEventListener("click",()=>{
    ch.classList.toggle("active");
    const t=ch.dataset.tag;
    if(ch.classList.contains("active")){ if(!filtroTags.includes(t)) filtroTags.push(t); }
    else{ filtroTags=filtroTags.filter(x=>x!==t); }
    render();
  });
});
document.querySelectorAll(".cat").forEach(c=>{
  c.addEventListener("click",()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    c.classList.add("active");
    filtroCat=c.dataset.cat;
    render();
  });
});

cargar();
</script>
</body>
</html>
