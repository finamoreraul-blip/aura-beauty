<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA BEAUTY - Tres Arroyos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#FFF9FB}
.brico{font-family:'Bricolage Grotesque'}
.serif{font-family:'Instrument Serif'}
.no-scrollbar::-webkit-scrollbar{display:none}
.card:hover{transform:translateY(-3px);transition:.2s}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-white border-b-2 border-black">
<div class="max-w-[1300px] mx-auto px-4 py-3 flex justify-between items-center">
<h1 class="brico text-[28px] font-extrabold leading-none">AURA <span class="serif italic font-normal">beauty</span><span class="block text-[10px] tracking-[0.2em] opacity-60">TRES ARROYOS</span></h1>
<button id="cartBtn" class="bg-black text-white rounded-full px-6 py-3 font-bold text-sm">CARRITO (<span id="cartCount">0</span>)</button>
</div>
</header>
<section class="max-w-[1300px] mx-auto p-4">
<div class="bg-[#FFD6E7] border-2 border-black rounded-[20px] p-4 flex justify-between">
<p class="brico font-extrabold text-sm">🔥 OFERTAS AURA</p><p class="text-xs font-bold opacity-60">Envio gratis +$15000</p>
</div>
<div id="ofertas" class="flex gap-3 overflow-x-auto no-scrollbar mt-4"></div>
<div id="filtros" class="flex gap-2 mt-6 overflow-x-auto no-scrollbar">
<button onclick="filtrar('Todos')" data-cat="Todos" class="filter-btn bg-black text-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">TODOS</button>
<button onclick="filtrar('Labios')" data-cat="Labios" class="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">LABIOS</button>
<button onclick="filtrar('Rostro')" data-cat="Rostro" class="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">ROSTRO</button>
<button onclick="filtrar('Ojos')" data-cat="Ojos" class="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">OJOS</button>
<button onclick="filtrar('Skincare')" data-cat="Skincare" class="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">SKINCARE</button>
<button onclick="filtrar('Accesorios')" data-cat="Accesorios" class="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold">ACCESORIOS</button>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"></div>
</section>
<div id="modal" class="fixed inset-0 bg-black/70 hidden p-4 z-[60]"><div class="bg-white border-[3px] border-black rounded-[24px] max-w-[700px] mx-auto mt-12 overflow-hidden"><div id="modalContent"></div><div class="p-4"><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full border-2 border-black rounded-full py-3 font-bold">CERRAR</button></div></div></div>
<div id="cartDrawer" class="fixed inset-0 hidden z-[70]"><div class="absolute inset-0 bg-black/50" onclick="toggleCart()"></div><div class="absolute right-0 top-0 h-full w-full max-w-[400px] bg-white border-l-[3px] border-black p-6 flex flex-col"><div class="flex justify-between items-center"><h3 class="brico text-2xl font-extrabold">TU CARRITO</h3><button onclick="toggleCart()" class="border-2 border-black rounded-full w-9 h-9 font-bold">X</button></div><div id="cartItems" class="mt-6 flex-1 overflow-y-auto space-y-3"></div><div class="mt-4 border-t-[3px] border-black pt-4"><div class="flex justify-between font-extrabold text-lg brico"><span>TOTAL</span><span id="cartTotal">$0</span></div><button onclick="checkout()" class="w-full bg-black text-white rounded-full py-4 font-extrabold mt-4">PEDIR POR WHATSAPP →</button><button onclick="cart=[];localStorage.setItem('aura_cart','[]');updateCart()" class="w-full border-2 border-black rounded-full py-2 text-xs font-bold mt-2">VACIAR</button></div></div></div>
<script>
const productos = [
{id:1,nombre:"Gloss Pétala Shine",precio:5800,precioOferta:4900,categoria:"Labios",stock:10,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600",desc:"Brillo intenso acabado pétalo, hidratación 8hs. Tono rosado universal AURA.",caracteristicas:["Vegano","8h duración","Hidratante"],visible:true,tags:["NUEVO"]},
{id:2,nombre:"Base Soft Glow",precio:12500,precioOferta:0,categoria:"Rostro",stock:10,img:"https://images.unsplash.com/photo-1557205465-f3768ff636b8?w=600",desc:"Base luminosa cobertura media, efecto piel real.",caracteristicas:["Cruelty free"],visible:true,tags:["TOP"]},
{id:3,nombre:"Rubor Cremoso Aura",precio:6700,precioOferta:5900,categoria:"Rostro",stock:3,img:"https://images.unsplash.com/photo-1583209814683-c023dd53cea6?w=600",desc:"Rubor cremoso fácil de difuminar, color natural.",caracteristicas:["Vegano"],visible:true,tags:[]},
{id:4,nombre:"Máscara Volumen X",precio:8900,precioOferta:0,categoria:"Ojos",stock:10,img:"https://images.unsplash.com/photo-1631214524115-6f33d2c4a36c?w=600",desc:"Pestañas XXL sin grumos.",caracteristicas:["A prueba de agua"],visible:true,tags:[]}
];
let cart = JSON.parse(localStorage.getItem('aura_cart')||'[]');
let categoriaActiva='Todos';
function filtrar(cat){categoriaActiva=cat;document.querySelectorAll('.filter-btn').forEach(b=>{if(b.dataset.cat===cat){b.className="filter-btn bg-black text-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold"}else{b.className="filter-btn bg-white border-2 border-black rounded-full px-5 py-2 text-xs font-bold"}});render()}
function render(){document.getElementById('ofertas').innerHTML=productos.filter(p=>p.visible&&p.precioOferta>0).map(p=>`<div class="min-w-[160px] bg-white border-2 border-black rounded-[16px] overflow-hidden cursor-pointer shrink-0 card" onclick="openModal(${p.id})"><div class="relative"><img src="${p.img}" class="w-full h-28 object-cover"><span class="absolute top-2 left-2 bg-black text-white text-[9px] font-bold rounded-full px-2 py-1">🔥 OFERTA</span></div><div class="p-2"><p class="brico text-[11px] font-bold leading-tight truncate">${p.nombre}</p><div class="flex gap-1 items-center mt-1"><p class="text-[13px] font-extrabold">$${p.precioOferta.toLocaleString('es-AR')}</p><p class="text-[10px] line-through opacity-40">$${p.precio.toLocaleString('es-AR')}</p></div></div></div>`).join('');const lista=productos.filter(p=>p.visible&&(categoriaActiva==='Todos'||p.categoria===categoriaActiva));document.getElementById('grid').innerHTML=lista.map(p=>`<div class="bg-white border-2 border-black rounded-[20px] overflow-hidden cursor-pointer card" onclick="openModal(${p.id})"><div class="relative bg-zinc-50"><img src="${p.img}" class="w-full h-56 md:h-64 object-cover"><div class="absolute top-2 left-2 flex gap-1 flex-wrap">${p.tags.includes('NUEVO')?'<span class="bg-[#FFD6E7] border border-black text-[9px] font-bold rounded-full px-2 py-1">NUEVO</span>':''}${p.tags.includes('TOP')?'<span class="bg-black text-white text-[9px] font-bold rounded-full px-2 py-1">TOP</span>':''}${p.precioOferta>0?'<span class="bg-black text-white text-[9px] font-bold rounded-full px-2 py-1">-'+Math.round((1-p.precioOferta/p.precio)*100)+'%</span>':''}</div>${p.stock<=3&&p.stock>0?'<span class="absolute bottom-2 left-2 bg-white border-2 border-black text-[9px] font-bold rounded-full px-2 py-1">¡Últimas!</span>':''}</div><div class="p-3"><p class="text-[10px] opacity-50 font-bold tracking-widest">${p.categoria.toUpperCase()}</p><p class="brico font-bold text-[14px] leading-[1.1] mt-1 h-[34px] overflow-hidden">${p.nombre}</p><div class="flex items-end justify-between mt-2"><div>${p.precioOferta>0?`<p class="font-extrabold text-[16px]">$${p.precioOferta.toLocaleString('es-AR')}</p><p class="text-[11px] line-through opacity-40">$${p.precio.toLocaleString('es-AR')}</p>`:`<p class="font-extrabold text-[16px]">$${p.precio.toLocaleString('es-AR')}</p>`}</div><button class="bg-black text-white rounded-full w-9 h-9 font-bold">+</button></div></div></div>`).join('');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0)}
function openModal(id){const p=productos.find(x=>x.id===id);document.getElementById('modalContent').innerHTML=`<img src="${p.img}" class="w-full h-[380px] object-cover"><div class="p-6"><p class="text-[11px] font-bold tracking-widest opacity-50">${p.categoria.toUpperCase()}</p><h2 class="brico text-[28px] font-extrabold leading-[0.95] mt-2">${p.nombre}</h2><div class="mt-4">${p.precioOferta>0?`<div class="flex gap-2 items-center"><p class="text-[28px] font-extrabold">$${p.precioOferta.toLocaleString('es-AR')}</p><p class="line-through opacity-40">$${p.precio.toLocaleString('es-AR')}</p></div>`:`<p class="text-[28px] font-extrabold">$${p.precio.toLocaleString('es-AR')}</p>`}</div><p class="text-sm opacity-70 mt-4">${p.desc}</p><div class="flex flex-wrap gap-1 mt-3">${(p.caracteristicas||[]).map(c=>`<span class="border-2 border-black rounded-full px-3 py-1 text-[10px] font-bold">${c}</span>`).join('')}</div><button onclick="addToCart(${p.id});document.getElementById('modal').classList.add('hidden')" class="w-full bg-black text-white rounded-full py-4 font-extrabold brico mt-6">AGREGAR AL CARRITO →</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function addToCart(id){const p=productos.find(x=>x.id===id);const price=p.precioOferta||p.precio;const f=cart.find(x=>x.id===id);if(f)f.qty++;else cart.push({...p,qty:1,price});localStorage.setItem('aura_cart',JSON.stringify(cart));updateCart()}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-3 py-2 border-b"><img src="${c.img}" class="w-14 h-14 rounded border-2 border-black object-cover"><div class="flex-1"><p class="brico font-bold text-xs">${c.nombre}</p><p class="text-xs">$${c.price.toLocaleString('es-AR')} x ${c.qty}</p><div class="flex gap-1 mt-1"><button onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);localStorage.setItem('aura_cart',JSON.stringify(cart));updateCart()" class="border-2 border-black rounded-full w-6 h-6 text-xs font-bold">-</button><button onclick="cart[${i}].qty++;localStorage.setItem('aura_cart',JSON.stringify(cart));updateCart()" class="border-2 border-black rounded-full w-6 h-6 text-xs font-bold">+</button></div></div><button onclick="cart.splice(${i},1);localStorage.setItem('aura_cart',JSON.stringify(cart));updateCart()" class="text-[10px] opacity-40">X</button></div>`).join('')||'<p class="text-sm opacity-50 text-center py-10">Carrito vacío</p>';document.getElementById('cartTotal').innerText='$'+cart.reduce((a,b)=>a+b.price*b.qty,0).toLocaleString('es-AR')}
function toggleCart(){document.getElementById('cartDrawer').classList.toggle('hidden');updateCart()}
function checkout(){if(cart.length===0)return;let m="Hola AURA BEAUTY!%0A%0AQuiero:%0A"+cart.map(c=>"- "+c.nombre+" x"+c.qty+" ($"+(c.price*c.qty)+")").join('%0A')+"%0ATOTAL: "+document.getElementById('cartTotal').innerText;window.open("https://wa.me/5492983389710?text="+m,'_blank')}
document.getElementById('cartBtn').onclick=toggleCart;
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.add('hidden')};
updateCart();render();
</script>
</body>
</html>
